<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b57">
<title>英语学习合集</title>
<style>
  :root{
    --paper:#f5f3ee; --card:#fff; --line:#e4dfd4; --ink:#0f6b57; --ink2:#0a4d3f;
    --text:#2c2a25; --mut:#7b7565; --ted:#0f6b57; --ali:#ff6a00;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:calc(env(safe-area-inset-top) + 26px) 16px calc(env(safe-area-inset-bottom) + 34px);
  }
  .wrap{max-width:760px;margin:0 auto}

  /* 顶部 */
  .kicker{
    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--mut);margin:0 0 10px;
  }
  h1{
    font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    font-size:30px;line-height:1.25;margin:0 0 8px;color:var(--ink2);letter-spacing:.01em;
  }
  .lead{margin:0 0 22px;color:var(--mut);font-size:14px}
  .rule{height:1px;background:var(--line);margin:0 0 18px}

  /* 卡片 */
  .deck{
    display:block;position:relative;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;margin:0 0 12px;
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .deck:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,60,45,.09);border-color:#d6cfbe}
  .deck:active{transform:translateY(0)}
  .deck::before{
    content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;
    background:var(--accent,var(--ink));opacity:.9;
  }
  .top{display:flex;align-items:center;gap:8px;margin:0 0 6px}
  .tag{
    font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;
    background:#eef3f0;color:var(--accent,var(--ink));border:1px solid #dbe7e1;font-weight:600;
  }
  .no{margin-left:auto;font-size:11.5px;color:#a9a294;font-variant-numeric:tabular-nums}
  .name{
    font-family:Georgia,"Songti SC","Noto Serif SC",serif;
    font-size:19px;line-height:1.35;margin:0 0 3px;color:#22322c;
  }
  .sub{margin:0 0 9px;font-size:13px;color:var(--mut)}
  .meta{font-size:12px;color:#8c8677;letter-spacing:.01em;margin:0 0 11px}

  .bar{height:6px;border-radius:999px;background:#ece7db;overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:999px;background:var(--accent,var(--ink));transition:width .5s ease}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:7px 0 0;font-size:12px;color:var(--mut)}
  .stat b{color:var(--accent,var(--ink));font-weight:700;font-variant-numeric:tabular-nums}
  .go{
    position:absolute;right:14px;bottom:13px;font-size:12px;color:var(--accent,var(--ink));
    font-weight:600;display:flex;align-items:center;gap:3px;
  }

  /* 空位 */
  .slot{
    border:1.5px dashed #d9d2c1;border-radius:16px;padding:15px 16px;
    color:#8f8878;font-size:12.5px;line-height:1.7;background:transparent;
  }
  .slot b{display:block;color:#6f6a5c;font-size:13.5px;margin:0 0 4px}
  .slot code{background:#efece3;border-radius:4px;padding:1px 5px;font-size:11.5px}

  footer{margin:22px 0 0;font-size:11.5px;color:#a29b8b;line-height:1.8}
  footer b{color:#7b7565;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">English · Collections</p>
  <h1>英语学习合集</h1>
  <p class="lead">一个入口，多套分开学。每套独立存储、互不混词，进度各自记。</p>
  <div class="rule"></div>

  <div id="decks"></div>

  <div class="slot">
    <b>还想再加一套？</b>
    新建一个文件夹（如 <code>more/</code>），把单文件页面放成 <code>more/index.html</code>，
    然后在本页 <code>DECKS</code> 数组里加一行即可——标题、副题、规模、进度键各填一次。
  </div>

  <footer>
    <b>数据说明</b>　各套使用各自的本地存储键（TED <code>p2t_*</code>、类目 <code>aliexpress_cat_learn_v1</code>），
    互不读写，删一套不会影响另一套。<br>
    <b>旧链接</b>　之前单独发布的两个站点仍然可用，与这里的进度是同一份数据（同一域名下的本地存储）。
  </footer>
</div>

<script>
/* ── 要加新的一套，只改这个数组 ── */
const DECKS = [
  {
    key:'ted',
    tag:'演讲精读',
    name:'Teach girls bravery, not perfection',
    sub:'教女孩勇敢，而不是完美 · Reshma Saujani · TED2016',
    meta:'97 句 · 149 生词 · 132 句型 · 原文精读 / 闪卡 / 错题本',
    href:'ted/',
    accent:'#0f6b57',
    total:149,
    unit:'词',
    read:()=>{
      const mas = readJSON('p2t_mas_v1', []);
      const mine = readJSON('p2t_mine_v1', []);
      const hid = readJSON('p2t_hide_v1', []);
      const done = Array.isArray(mas) ? mas.length : 0;
      const total = 149 - (Array.isArray(hid) ? hid.length : 0);
      return {
        done:done,
        total:Math.max(total, 1),
        note:(Array.isArray(mine) ? mine.length : 0) + ' 个自建生词'
      };
    }
  },
  {
    key:'alibaba',
    tag:'行业词汇',
    name:'阿里巴巴国际站 · 类目英语',
    sub:'Alibaba.com 全站类目树，按 一级 › 单元 逐级学',
    meta:'38 个一级 · 408 单元 · 3346 条 · 学 / 测 / 错题复习',
    href:'alibaba/',
    accent:'#ff6a00',
    total:3346,
    unit:'条',
    read:()=>{
      const st = readJSON('aliexpress_cat_learn_v1', null);
      const known = st && st.known && typeof st.known === 'object' ? Object.keys(st.known).length : 0;
      return { done:known, total:3346, note:known ? '已标注掌握' : '还没开始' };
    }
  }
];

function readJSON(k, dft){
  try{
    const raw = localStorage.getItem(k);
    if(!raw) return dft;
    return JSON.parse(raw);
  }catch(e){ return dft }
}

function pct(done, total){
  if(!total) return 0;
  return Math.max(0, Math.min(100, Math.round(done / total * 100)));
}

function render(){
  const host = document.getElementById('decks');
  host.innerHTML = DECKS.map((d, i) => {
    let info = { done:0, total:d.total || 1, note:'' };
    try{ info = Object.assign(info, d.read ? d.read() : {}) }catch(e){}

    const p = pct(info.done, info.total);
    const num = String(i + 1).padStart(2, '0');
    const label = p ? (p + '%') : '未开始';
    return ''
      + '<a class="deck" href="' + d.href + '" style="--accent:' + d.accent + '">'
      +   '<div class="top"><span class="tag">' + esc(d.tag) + '</span><span class="no">' + num + '</span></div>'
      +   '<p class="name">' + esc(d.name) + '</p>'
      +   '<p class="sub">' + esc(d.sub) + '</p>'
      +   '<p class="meta">' + esc(d.meta) + '</p>'
      +   '<div class="bar"><i style="width:' + p + '%"></i></div>'
      +   '<div class="stat">'
      +     '<span><b>' + esc(label) + '</b>　已掌握 ' + info.done + ' / ' + info.total + ' ' + esc(d.unit || '') + '</span>'
      +     '<span>' + esc(info.note || '') + '</span>'
      +   '</div>'
      +   '<span class="go">进入 →</span>'
      + '</a>';
  }).join('');
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

render();
/* 从子页面返回时刷新进度 */
window.addEventListener('pageshow', render);
document.addEventListener('visibilitychange', () => { if(!document.hidden) render() });
</script>
</body>
</html>
