<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1A2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>国际站类目学习站</title>
<style>
:root{
  --bg:#f5f3ee; --panel:#fff; --ink:#2c2a25; --ink2:#6f6a5c; --ink3:#a29b8b;
  --line:#e4dfd4; --brand:#0f6b57; --brand-dk:#0a4d3f; --navy:#0f6b57; --navy2:#0a4d3f;
  --ok:#12A87A; --ok-bg:#E6F7F1; --bad:#E5484D; --bad-bg:#FDECEC;
  --r:14px; --r-sm:10px;
  --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.hide{display:none !important}

/* ---------- 顶栏 ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 11px;
  box-shadow:0 2px 14px rgba(15,26,46,.18);
}
.tb-row{display:flex;align-items:center;gap:10px}
.tb-back{
  width:34px;height:34px;flex:none;border-radius:10px;display:flex;align-items:center;
  justify-content:center;background:rgba(255,255,255,.12);font-size:17px;
}
.tb-back:active{background:rgba(255,255,255,.24)}
.tb-title{flex:1;min-width:0}
.tb-title b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title span{display:block;font-size:11.5px;color:rgba(255,255,255,.62);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-ring{flex:none;display:flex;align-items:center;gap:7px}
.tb-ring-txt{font-size:11px;color:rgba(255,255,255,.7);text-align:right;line-height:1.25}
.tb-ring-txt b{display:block;font-size:14px;color:var(--brand);font-weight:700}
.tb-bar{height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:9px;overflow:hidden}
.tb-bar i{display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--brand),#FFA45C);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- 主区 ---------- */
main{padding:14px 14px calc(78px + env(safe-area-inset-bottom));min-height:calc(100vh - 96px)}
.view{animation:fadeUp .26s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.sec-h h2{margin:0;font-size:15px;font-weight:700;letter-spacing:.2px}
.sec-h span{font-size:12px;color:var(--ink3)}

/* 搜索 */
.search{position:relative;margin-bottom:13px}
.search input{
  width:100%;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--panel);
  padding:0 42px 0 40px;font-size:15px;color:var(--ink);outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,106,0,.12)}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--ink3)}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;
  border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:15px}

/* 一级类目卡 */
.grp{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;
  transition:transform .14s,box-shadow .18s,border-color .18s;
}
.grp:active{transform:scale(.985);border-color:#CFD6E2}
.grp-idx{
  width:34px;height:34px;flex:none;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;color:var(--brand);
  background:linear-gradient(145deg,#FFF1E6,#FFE3CC);border:1px solid #FFD6B8;
}
.grp-mid{flex:1;min-width:0}
.grp-mid b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-mid i{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp-right{flex:none;text-align:right}
.grp-right .pct{font-size:13px;font-weight:700;color:var(--ink3)}
.grp-right .pct.done{color:var(--ok)}
.grp-right .n{font-size:11px;color:var(--ink3);margin-top:1px}
.mini-bar{height:4px;border-radius:3px;background:#EDF0F5;margin-top:8px;overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#12A87A,#3ED0A3);
  transition:width .4s ease}

/* 单元卡 */
.unit{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;
}
.unit:active{background:#FAFBFD}
.unit-top{display:flex;align-items:center;gap:10px}
.unit-id{font-size:11.5px;font-weight:700;color:var(--ink3);flex:none;
  font-variant-numeric:tabular-nums;min-width:30px}
.unit-name{flex:1;min-width:0}
.unit-name b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-name span{display:block;font-size:12px;color:var(--ink2);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit-tag{flex:none;font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600}
.tag-leaf{background:#EEF3FF;color:#3A62D6}
.tag-done{background:var(--ok-bg);color:var(--ok)}
.tag-new{background:#FFF1E6;color:var(--brand-dk)}

/* ---------- 学习卡片 ---------- */
.study-wrap{padding-top:2px}
.card-scene{perspective:1200px;position:relative;margin-bottom:14px}
.card{
  position:relative;border-radius:22px;background:var(--panel);
  border:1px solid var(--line);box-shadow:0 8px 26px rgba(17,26,43,.07);
  min-height:390px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);
}
.card.flip{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;padding:20px 18px 58px;backface-visibility:hidden;
  display:flex;flex-direction:column;border-radius:22px;overflow:hidden;
}
.face.back{transform:rotateY(180deg);background:linear-gradient(165deg,#FFFDF9 0%,#FFF7EC 100%)}
.card-badge{
  align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--brand-dk);
  background:#FFF1E6;border:1px solid #FFDCC2;padding:3px 9px;border-radius:7px;margin-bottom:10px;
}
.card-img{
  align-self:center;width:min(58%,190px);aspect-ratio:1/1;margin:2px auto 14px;border-radius:16px;
  background:linear-gradient(160deg,#fff,#F3F5F9);border:1px solid var(--line);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.card-img img{width:100%;height:100%;object-fit:contain;display:block}
.card-emoji{font-size:64px;line-height:1}
.card-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0 4px}
.card-en{font-size:clamp(21px,5.6vw,27px);font-weight:700;letter-spacing:-.2px;line-height:1.28;word-break:break-word}
.card-zh{font-size:clamp(24px,6.4vw,31px);font-weight:700;letter-spacing:.3px;line-height:1.3;color:#B4500A}
.card-hint{font-size:11.5px;color:var(--ink3);margin-top:11px}
.card-path{
  border-top:1px dashed #E6DCCB;padding-top:10px;margin-top:12px;text-align:center;
}
.card-path .lab{font-size:10.5px;color:var(--ink3);letter-spacing:.5px}
.card-path .val{font-size:12px;color:var(--ink2);margin-top:3px;line-height:1.5;
  word-break:break-word}
.btn-speak{
  position:absolute;right:14px;bottom:14px;width:var(--tap);height:var(--tap);border-radius:50%;
  background:var(--brand);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 14px rgba(255,106,0,.35);z-index:5;transition:transform .12s;
}
.btn-speak:active{transform:scale(.9)}
.btn-speak.on{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,106,0,.5)}50%{box-shadow:0 0 0 13px rgba(255,106,0,0)}}
.btn-flip{
  position:absolute;left:14px;bottom:14px;width:var(--tap);height:var(--tap);border-radius:50%;
  background:linear-gradient(145deg,#2A3A57,#16233A);color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 14px rgba(15,26,46,.28);z-index:5;transition:transform .12s;
}
.btn-flip:active{transform:scale(.9)}

/* 导航条 */
.nav-row{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.nav-btn{
  flex:none;height:var(--tap);min-width:var(--tap);padding:0 15px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
}
.nav-btn:disabled{opacity:.4}
.nav-btn:active:not(:disabled){background:#EEF1F6}
.nav-btn.main{
  flex:1;background:linear-gradient(135deg,var(--brand),#FF8A3D);color:#fff;border:none;
  box-shadow:0 5px 15px rgba(255,106,0,.3);
}
.nav-btn.main:active{background:var(--brand-dk)}
.nav-count{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;text-align:center;
  margin-bottom:9px}
.known-btn{
  width:100%;height:46px;border-radius:13px;background:var(--ok-bg);color:var(--ok);
  border:1px solid #C9EEDF;font-size:14.5px;font-weight:700;margin-bottom:10px;
}
.known-btn:active{background:#D5F2E6}
.known-btn.is-known{background:#F0F2F6;color:var(--ink3);border-color:var(--line)}

/* ---------- 测验 ---------- */
.quiz-head{display:flex;gap:8px;margin-bottom:12px}
.q-chip{
  flex:1;padding:11px 8px;border-radius:13px;background:var(--panel);border:1px solid var(--line);
  text-align:center;font-size:12.5px;color:var(--ink2);font-weight:600;
}
.q-chip.sel{background:var(--navy);border-color:var(--navy);color:#fff}
.q-bar{height:5px;border-radius:3px;background:#E8ECF3;overflow:hidden;margin-bottom:14px}
.q-bar i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width .3s}
.q-card{
  background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px 18px;
  margin-bottom:14px;box-shadow:0 6px 20px rgba(17,26,43,.06);text-align:center;
}
.q-label{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--brand-dk);
  background:#FFF1E6;display:inline-block;padding:3px 9px;border-radius:6px;margin-bottom:14px}
.q-word{font-size:clamp(20px,5.4vw,26px);font-weight:700;line-height:1.3;word-break:break-word}
.q-sub{font-size:12px;color:var(--ink3);margin-top:8px}
.opt{
  width:100%;min-height:52px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);
  padding:13px 16px;margin-bottom:9px;text-align:left;font-size:14.5px;line-height:1.4;
  display:flex;align-items:center;gap:10px;transition:border-color .16s,background .16s,transform .1s;
}
.opt:active{transform:scale(.99)}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:8px;background:#F0F3F8;color:var(--ink2);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.opt .t{flex:1;min-width:0;word-break:break-word}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.muted{opacity:.5}
.q-fb{
  border-radius:13px;padding:12px 14px;font-size:13.5px;line-height:1.55;margin-bottom:12px;
}
.q-fb.ok{background:var(--ok-bg);color:#0B7A57;border:1px solid #C9EEDF}
.q-fb.no{background:var(--bad-bg);color:#B23337;border:1px solid #F8D3D4}
.q-fb b{font-weight:700}

/* 结算 */
.result{text-align:center;padding:22px 16px}
.result .score{font-size:52px;font-weight:800;letter-spacing:-2px;color:var(--brand);
  font-variant-numeric:tabular-nums}
.result .score small{font-size:19px;color:var(--ink3);font-weight:600;letter-spacing:0}
.result .sub{font-size:13.5px;color:var(--ink2);margin-top:7px}
.result .row{display:flex;gap:10px;margin-top:22px}
.result .row button{flex:1;height:48px;border-radius:13px;font-size:14.5px;font-weight:700}
.btn-primary{background:linear-gradient(135deg,var(--brand),#FF8A3D);color:#fff;
  box-shadow:0 5px 15px rgba(255,106,0,.28)}
.btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--ink)}

/* ---------- 错题 / 我的 ---------- */
.empty{
  text-align:center;padding:52px 22px;color:var(--ink3);
}
.empty .ico{font-size:42px;margin-bottom:12px;opacity:.75}
.empty b{display:block;font-size:15px;color:var(--ink2);margin-bottom:6px}
.empty span{font-size:12.5px;line-height:1.6}
.wrong-item{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  margin-bottom:8px;display:flex;gap:11px;align-items:flex-start;
}
.wrong-item .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-top:7px}
.wrong-item .txt{flex:1;min-width:0}
.wrong-item .txt b{display:block;font-size:14px;font-weight:600;word-break:break-word}
.wrong-item .txt span{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;word-break:break-word}
.wrong-item .cnt{flex:none;font-size:11px;color:var(--bad);background:var(--bad-bg);
  padding:2px 7px;border-radius:6px;font-weight:700}

.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 16px;margin-bottom:11px;
}
.panel h3{margin:0 0 11px;font-size:13px;font-weight:700;color:var(--ink2);letter-spacing:.3px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{text-align:center;padding:11px 4px;background:#FAFBFD;border-radius:12px}
.stat b{display:block;font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--ink3);margin-top:2px}
.stat.hi b{color:var(--brand)}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;
  border-bottom:1px solid #F0F2F6;font-size:14px}
.set-row:last-child{border-bottom:none}
.set-row small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.switch{position:relative;width:46px;height:27px;border-radius:14px;background:#DDE2EA;
  flex:none;transition:background .2s}
.switch.on{background:var(--ok)}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on::after{transform:translateX(19px)}
.danger-btn{width:100%;height:44px;border-radius:12px;background:var(--bad-bg);color:var(--bad);
  font-size:14px;font-weight:700;border:1px solid #F8D3D4;margin-top:4px}

/* ---------- 底部 Tab ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px;
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:11px;
  color:var(--ink3);font-size:10.5px;font-weight:600;position:relative;
}
.tab .ico{font-size:19px;line-height:1}
.tab.on{color:var(--brand);background:#FFF6EE}
.tab .badge{
  position:absolute;top:2px;right:calc(50% - 21px);min-width:16px;height:16px;padding:0 4px;
  border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);
  background:rgba(17,26,43,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:11px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:90;max-width:82vw;
  text-align:center;line-height:1.45;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:560px){
  main{max-width:560px;margin:0 auto}
  .tabbar{max-width:560px;margin:0 auto;border-radius:14px 14px 0 0}
}

/* ===== TED 视觉统一（追加覆盖，晚于原规则生效） ===== */
body{
  background:var(--bg); color:var(--ink);
  padding-top:env(safe-area-inset-top);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

/* 头部：绿卡 hero */
.hero{
  margin:12px 12px 0; padding:15px 16px 14px; border-radius:16px; color:#fff;
  background:linear-gradient(158deg,#116b58 0%,#0a4d3f 100%);
  box-shadow:0 8px 22px rgba(15,107,87,.16); position:relative;
}
.hero-kicker{margin:0 0 7px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.hero-title{
  margin:0 0 5px;font-size:21px;line-height:1.32;letter-spacing:.01em;color:#fff;font-weight:700;
  font-family:Georgia,"Songti SC","Noto Serif SC",serif;
}
.hero-sub{margin:0 0 11px;font-size:12px;color:rgba(255,255,255,.78)}
.hero-prog{height:5px;border-radius:999px;background:rgba(255,255,255,.22);overflow:hidden}
.hero-prog i{display:block;height:100%;width:0;border-radius:999px;background:#fff;transition:width .45s ease}
.hero-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:11.5px;color:rgba(255,255,255,.78)}
.hero-meta b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.hero-back{
  position:absolute;right:12px;top:12px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.12);color:#fff;border-radius:999px;
  font-size:11.5px;font-family:inherit;padding:4px 10px;cursor:pointer;
}

/* 横排页签（TED 式，吸顶） */
.tabbar{
  position:sticky;top:0;z-index:40;margin:10px 0 0;padding:0 8px;
  display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  background:rgba(245,243,238,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.tab{
  flex:1 1 0;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;gap:3px;
  padding:12px 4px 11px;border:0;background:none;color:var(--ink3);line-height:1.1;
  font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;position:relative;border-radius:0;
  min-height:44px;
}
.tab .ico{display:none}
.tab.on{color:var(--brand);background:none}
.tab.on::after{
  content:"";position:absolute;left:22%;right:22%;bottom:3px;height:2.5px;
  border-radius:2px;background:var(--brand);
}
.tab .n{font-size:11px;font-weight:600;color:inherit;opacity:.8}
.tab .badge{
  position:static;transform:none;margin-left:3px;background:var(--bad);color:#fff;
  font-size:10px;line-height:1;padding:2px 5px;border-radius:999px;
}

/* 内容区 */
main{padding:14px 12px 40px;max-width:760px;margin:0 auto;min-height:0}
.sec-h{margin:2px 2px 10px}
.sec-h h2{font-size:14.5px;color:var(--ink)}
.sec-h span{font-size:11.5px;color:var(--ink3)}

/* 卡片：白底细边、轻圆角，取消重投影 */
.grp,.unit,.panel{

}

.grp-mid i{font-size:11.5px;color:var(--ink3)}

.pct.done{color:var(--ok)}

/* 搜索框 */
.search input{

}
.search .ic{left:13px}
.search input:focus{border-color:#bcd4cb;box-shadow:0 0 0 3px rgba(15,107,87,.08)}

.nav-btn{border-radius:11px;background:#fff}

/* ===== 存储 ===== */
const LS_KEY = 'aliexpress_cat_learn_v1';
let S = { known: {}, wrong: {}, settings: { tts: true, img: true }, lastUnit: null };

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      S.known = p.known || {};
      S.wrong = p.wrong || {};
      S.settings = Object.assign({ tts: true, img: true }, p.settings || {});
      S.lastUnit = p.lastUnit || null;
    }
  } catch (e) { /* 忽略损坏数据 */ }
}
function saveState() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ===== 工具 ===== */
const $ = id => document.getElementById(id);
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function imgUrl(item) {
  if (!S.settings.img || !item.img) return '';
  return DB.meta.imgPrefix + item.img.replace(/\.(jpg|png|webp)$/i, '') + DB.meta.imgSuffix;
}
function unitById(id) { return DB.units.find(u => u.id === id); }
function knownOf(unitId) { return S.known[unitId] || []; }
function isKnown(unitId, en) { return knownOf(unitId).indexOf(en) >= 0; }
function unitDone(unitId) { return knownOf(unitId).length; }
function totalKnown() {
  return Object.keys(S.known).reduce((n, k) => n + S.known[k].length, 0);
}
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
let toastTimer = null;
function toast(msg, ms) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms || 1600);
}
const wrongKey = (unitId, en) => unitId + '||' + en;
function wrongList() {
  return Object.keys(S.wrong).map(k => S.wrong[k]);
}
function dueWrong() {
  const now = Date.now();
  return wrongList().filter(w => !w.due || w.due <= now);
}

/* ===== 朗读 ===== */
let voiceEN = null;
function pickVoice() {
  /* 优先本地英语语音；非本地语音在部分安卓上会静默失败 */
  const vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  const en = vs.filter(v => /^en[-_]/i.test(v.lang || ''));
  const gb = en.filter(v => /^en[-_]GB/i.test(v.lang));
  const loc = v => v.localService !== false;
  voiceEN = gb.filter(loc)[0] || gb[0] || en.filter(loc)[0] || en[0] || null;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
const TTSH = {};
function ttsHint(kind) {
  if (TTSH[kind]) return; TTSH[kind] = 1;
  const m = {
    unsupported: '这个浏览器不支持朗读，请用 Chrome / Safari / Edge 打开',
    blocked: '浏览器拦住了朗读，先点一下页面空白处再试',
    novoice: '手机里没有英语语音包：设置 → 语言和输入法 → 文字转语音 → 安装 English',
    silent: '点了没出声：先看手机是否静音，再看系统「文字转语音」有没有装英语'
  }[kind];
  if (m) toast(m, 4200);
}
function speak(text) {
  if (!S.settings.tts || !window.speechSynthesis) return;
  let u;
  try { u = new SpeechSynthesisUtterance(text); } catch (e) { ttsHint('unsupported'); return; }
  /* 缺 en-GB 语音时退回系统默认，避免指定到不存在的语音导致静音 */
  u.lang = voiceEN ? voiceEN.lang : 'en-US';
  if (voiceEN) u.voice = voiceEN;
  u.rate = 0.92;
  let started = false;
  u.onstart = () => { started = true; };
  u.onerror = ev => ttsHint((ev && ev.error) === 'not-allowed' ? 'blocked' : (voiceEN ? 'silent' : 'novoice'));
  const fire = () => {
    try { if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {}
    try { speechSynthesis.speak(u); } catch (e) { ttsHint('silent'); return; }
    /* 安卓上可能既不报错也不发声：1.2s 无 onstart 就提示一次 */
    setTimeout(() => { if (!started) ttsHint(voiceEN ? 'silent' : 'novoice'); }, 1200);
  };
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(fire, 80);
  } else fire();
}

/* ===== 顶栏 ===== */
function refreshTop() {
  const done = totalKnown(), all = DB.meta.items;
  $('tbPct').textContent = pct(done, all) + '%';
  $('tbBar').style.width = pct(done, all) + '%';

    for (const it of u.items) {

      }
      if (res.length > 200) break;

/* ===== 间隔重复：错题记账 ===== */
const DAY = 86400000;
function recordWrong(unitId, item) {
  const k = wrongKey(unitId, item.en);
  const w = S.wrong[k] || { unitId, en: item.en, zh: item.zh, count: 0 };
  w.count = (w.count || 0) + 1;
  w.last = Date.now();
  w.due = Date.now() + (w.count >= 2 ? 3 : 1) * DAY;
  S.wrong[k] = w;
  saveState();
}
function recordRight(unitId, item) {
  const k = wrongKey(unitId, item.en);
  const w = S.wrong[k];
  if (!w) return;
  w.count = (w.count || 0) - 1;
  if (w.count <= 0) delete S.wrong[k];
  else { w.due = Date.now() + 7 * DAY; }
  saveState();
}

function shuffle(a) {

    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 从单元出题 */
function startQuiz(unitId) {
  const u = unitById(unitId);
  if (!u) return;
  const pool = u.items.map(it => ({ unit: u, item: it }));
  buildQuiz(shuffle(pool), `单元 ${u.id} · ${u.l2zh}`);
}

/* 智能：优先未掌握条目，最多 20 题 */
function startSmart() {
  const pool = [];
  for (const u of DB.units) {
    for (const it of u.items) {
      if (!isKnown(u.id, it.en)) pool.push({ unit: u, item: it });
    }
  }
  if (!pool.length) return toast('全部类目都已掌握，太强了 🎉');
  // 错题优先级更高
  const wrongSet = new Set(wrongList().map(w => wrongKey(w.unitId, w.en)));
  pool.sort((a, b) => {
    const wa = wrongSet.has(wrongKey(a.unit.id, a.item.en)) ? 0 : 1;
    const wb = wrongSet.has(wrongKey(b.unit.id, b.item.en)) ? 0 : 1;
    return wa - wb;
  });
  buildQuiz(shuffle(pool.slice(0, 40)).slice(0, 20), '智能练习 · 20 题');
}

function startFromWrong(list) {
  const pool = list.map(w => {
    const u = unitById(w.unitId);
    const it = u ? u.items.find(x => x.en === w.en) : null;
    return u && it ? { unit: u, item: it } : null;
  }).filter(Boolean);
  if (!pool.length) return toast('错题数据异常，先做智能练习');
  buildQuiz(shuffle(pool), `错题复习 · ${pool.length} 题`);
}

function buildQuiz(pool, title) {
  Q = { pool, idx: 0, right: 0, wrongs: [], title, locked: false, total: pool.length };
  switchTab('quiz');
  renderQuestion();
}

function makeOptions(entry) {
  const { unit, item } = entry;
  const askEn = Math.random() < 0.7;          // 70% 英→中，30% 中→英
  const correct = askEn ? item.zh : item.en;
  const pool = [];
  const push = x => {
    const v = askEn ? x.zh : x.en;
    if (v !== correct && pool.indexOf(v) < 0) pool.push(v);
  };
  shuffle(unit.items.slice()).forEach(push);
  if (pool.length < 3) {
    // 同层级其他单元补齐
    const others = shuffle(DB.units.filter(u => u !== unit && u.l1en === unit.l1en));
    for (const u of others) {
      for (const it of shuffle(u.items.slice())) {
        push(it);
        if (pool.length >= 3) break;
      }
      if (pool.length >= 3) break;
    }
  }
  const opts = shuffle([correct, ...pool.slice(0, 3)]);
  return { askEn, correct, opts };
}

function renderQuestion() {
  if (!Q) return renderQuizHome();
  if (Q.idx >= Q.total) return renderQuizResult();
  const entry = Q.pool[Q.idx];
  const { unit, item } = entry;
  const { askEn, correct, opts } = makeOptions(entry);
  Q.cur = { entry, askEn, correct, opts };
  Q.locked = false;

  setTop(Q.title, `第 ${Q.idx + 1} / ${Q.total} 题`);
  $('quizBody').innerHTML = `
  <div class="q-bar"><i style="width:${pct(Q.idx, Q.total)}%"></i></div>
  <div class="q-card">
    <div class="q-label">${askEn ? '选中文意思' : '选英文类目'}</div>
    <div class="q-word">${esc(askEn ? item.en : item.zh)}</div>
    <div class="q-sub">${esc(unit.l1zh)} › ${esc(unit.l2zh)}</div>
  </div>
  <div id="opts">${opts.map((o, i) =>
    `<button class="opt" data-o="${esc(o)}"><span class="k">${'ABCD'[i]}</span><span class="t">${esc(o)}</span></button>`
  ).join('')}</div>
  <div id="qfb"></div>`;

  document.querySelectorAll('#opts .opt').forEach(btn => {
    btn.onclick = () => answer(btn.dataset.o, btn);
  });
}

function answer(choice, btn) {
  if (!Q || Q.locked) return;
  Q.locked = true;
  const { entry, correct } = Q.cur;
  const ok = choice === correct;
  const opts = document.querySelectorAll('#opts .opt');
  opts.forEach(b => {
    if (b.dataset.o === correct) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('muted');
  });

  if (ok) {
    Q.right++;
    recordRight(entry.unit.id, entry.item);
    speak(entry.item.en);
  } else {
    Q.wrongs.push(entry);
    recordWrong(entry.unit.id, entry.item);
  }
  refreshTop();

  const fb = $('qfb');
  fb.innerHTML = ok
    ? `<div class="q-fb ok">✓ 答对了　<b>${esc(entry.item.en)}</b> = ${esc(entry.item.zh)}</div>`
    : `<div class="q-fb no">✗ 答案：<b>${esc(entry.item.en)}</b> = ${esc(entry.item.zh)}</div>`;

  setTimeout(() => {
    Q.idx++;
    renderQuestion();
  }, ok ? 620 : 1250);
}

function renderQuizResult() {
  const acc = pct(Q.right, Q.total);
  const say = acc >= 90 ? '非常稳，可以进下一单元了' : acc >= 70 ? '基本掌握，再练一遍会更牢'
    : acc >= 50 ? '还有不少生疏，建议回看卡片' : '这批偏难，先看一遍再测';
  setTop('测验结果', `${Q.title}`);
  $('quizBody').innerHTML = `
  <div class="result">
    <div class="score">${acc}<small>分</small></div>
    <div class="sub">答对 ${Q.right} / ${Q.total} 题　·　${say}</div>
    <div class="row">
      <button class="btn-ghost" id="rAgain">再测一次</button>
      <button class="btn-primary" id="rNext">${Q.wrongs.length ? '复习错题' : '返回'}</button>
    </div>
  </div>
  ${Q.wrongs.length ? `<div class="sec-h" style="margin-top:18px"><h2>本轮错题</h2><span>${Q.wrongs.length} 条，已进错题本</span></div>` +
    Q.wrongs.map(w => `<div class="wrong-item"><div class="dot"></div><div class="txt">
      <b>${esc(w.item.en)}</b><span>${esc(w.item.zh)}</span></div></div>`).join('') : ''}
  <div style="height:8px"></div>`;
  $('rAgain').onclick = () => { if (Q.wrongs.length) startFromWrong(Q.wrongs.map(w => ({ unitId: w.unit.id, en: w.item.en, zh: w.item.zh }))); else startQuiz(Q.pool[0].unit.id); };
  $('rNext').onclick = () => {
    if (Q.wrongs.length) startFromWrong(Q.wrongs.map(w => ({ unitId: w.unit.id, en: w.item.en, zh: w.item.zh })));
    else switchTab('learn');
  };
}

    return;
  }

  const sorted = all.sort((a, b) => (a.due || 0) - (b.due || 0));
  const fmt = t => {
    if (!t) return '待复习';
    const d = Math.ceil((t - Date.now()) / DAY);

    return `${d} 天后`;
  };
  $('reviewBody').innerHTML = `
  <button class="nav-btn main" id="rStart" style="width:100%;height:50px;margin-bottom:14px">
    🔁 开始复习（${due.length} 题到期）
  </button>
  <div class="sec-h"><h2>错题清单</h2><span>共 ${all.length} 条</span></div>
  ${sorted.map(w => {
    const u = unitById(w.unitId);
    const isDue = !w.due || w.due <= Date.now();
    return `<div class="wrong-item" data-u="${esc(w.unitId)}" data-en="${esc(w.en)}">
      <div class="dot" style="background:${isDue ? 'var(--brand)' : 'var(--ink3)'}"></div>
      <div class="txt">
        <b>${esc(w.en)}</b>
        <span>${esc(w.zh)}${u ? '　·　' + esc(u.l2zh) : ''}</span>
        <span style="color:${isDue ? 'var(--brand)' : 'var(--ink3)'};margin-top:4px;font-size:11.5px">
          ${fmt(w.due)}　·　累计错 ${w.count} 次</span>
      </div>
      <div class="cnt">${w.count}×</div>
    </div>`;
  }).join('')}`;

  $('rStart').onclick = () => {
    if (!due.length) return toast('暂无到期错题（按 1/3/7 天安排）');
    startFromWrong(due);
  };
  document.querySelectorAll('#reviewBody .wrong-item').forEach(el => {
    el.onclick = () => {
      const u = unitById(el.dataset.u);
      if (u) {
        const i = u.items.findIndex(x => x.en === el.dataset.en);
        curGroup = u.l1en; curUnitId = u.id; curIdx = Math.max(0, i);
        learnMode = 'card';
        switchTab('learn');
      }
    };
  });
}

/* ===== 我的 ===== */
function renderMe() {
  const done = totalKnown(), all = DB.meta.items;
  const wr = wrongList().length, due = dueWrong().length;
  const startedUnits = Object.keys(S.known).filter(k => (S.known[k] || []).length > 0).length;
  setTop('我的进度', `${DB.meta.l1} 个一级 · ${DB.meta.units} 个单元`);
  $('btnBack').classList.add('hide');

  $('meBody').innerHTML = `
  <div class="panel">
    <h3>总体进度</h3>
    <div class="stat-grid">
      <div class="stat hi"><b>${pct(done, all)}%</b><span>已掌握 ${done}</span></div>
      <div class="stat"><b>${startedUnits}</b><span>学过的单元</span></div>
      <div class="stat"><b>${wr}</b><span>错题</span></div>
    </div>
    <div class="mini-bar" style="margin-top:12px;height:6px"><i style="width:${pct(done, all)}%"></i></div>
    <div style="font-size:11.5px;color:var(--ink3);margin-top:7px">共 ${all} 条类目，还有 ${all - done} 条待学</div>
  </div>

  <div class="panel">
    <h3>各一级类目进度</h3>
    <div id="meGroups"></div>
  </div>

  <div class="panel">
    <h3>设置</h3>
    <div class="set-row">
      <div>朗读英文<small>点 🔊 时播放英音</small></div>
      <div class="switch ${S.settings.tts ? 'on' : ''}" id="swTts"></div>
    </div>
    <div class="set-row">
      <div>显示配图<small>关掉可省流量、加载更快</small></div>
      <div class="switch ${S.settings.img ? 'on' : ''}" id="swImg"></div>
    </div>
  </div>

  <div class="panel">
    <h3>数据</h3>
    <div style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:11px">
      学习进度只存在这台手机的浏览器里，不上传。清空后无法恢复。
    </div>
    <button class="danger-btn" id="btnReset">清空全部学习进度</button>
  </div>
  <div style="text-align:center;font-size:11px;color:var(--ink3);padding:6px 0 2px">
    国际站类目学习站 · ${DB.meta.items} 条 · ${DB.meta.units} 单元
  </div>`;

  $('meGroups').innerHTML = DB.groups.map(g => {
    const gUnits = DB.units.filter(u => u.l1en === g.en);
    const d = gUnits.reduce((n, u) => n + unitDone(u.id), 0);
    const p = pct(d, g.items);
    return `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">
        <span style="color:var(--ink)">${esc(g.zh)}</span>
        <span style="color:var(--ink3);font-variant-numeric:tabular-nums">${d}/${g.items}</span>
      </div>
      <div class="mini-bar"><i style="width:${p}%"></i></div>
    </div>`;
  }).join('');

  $('swTts').onclick = () => {
    S.settings.tts = !S.settings.tts;
    saveState();
    $('swTts').classList.toggle('on', S.settings.tts);
    toast(S.settings.tts ? '朗读已开启' : '朗读已关闭');
  };
  $('swImg').onclick = () => {
    S.settings.img = !S.settings.img;
    saveState();
    $('swImg').classList.toggle('on', S.settings.img);
    toast(S.settings.img ? '配图已开启' : '配图已关闭（省流量）');
  };
  $('btnReset').onclick = () => {
    if (!confirm('确定清空全部学习进度、错题和设置吗？此操作不可恢复。')) return;
    S = { known: {}, wrong: {}, settings: { tts: true, img: true }, lastUnit: null };
    saveState();
    refreshTop();
    renderMe();
    toast('已清空');
  };
}

/* ===== 初始化 ===== */
(function init() {
  loadState();
  document.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => switchTab(el.dataset.tab);
  });
  $('btnBack').onclick = () => {
    if (curTab !== 'learn') return switchTab('learn');
    if (learnMode === 'card') { learnMode = 'units'; renderLearn(); }
    else if (learnMode === 'units') { learnMode = 'groups'; curGroup = null; renderLearn(); }
  };
  const inp = $('inSearch');
  let tmr = null;
  inp.oninput = () => {
    clearTimeout(tmr);
    tmr = setTimeout(() => {
      if (learnMode === 'card') learnMode = 'groups';
      renderLearn();
    }, 160);
  };
  $('btnClr').onclick = () => { inp.value = ''; renderLearn(); inp.focus(); };

  switchTab('learn');
  refreshTop();
})();

</script>
</body>
</html>
